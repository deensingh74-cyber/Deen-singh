<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0D1B3E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="शिक्षा सेतु - शिक्षा का पुल, हर घर तक | ऑनलाइन कोर्स, लाइव क्लास, टेस्ट और नोट्स">
    <title>शिक्षा सेतु - शिक्षा का पुल, हर घर तक</title>

    <!-- PWA Manifest (भविष्य के लिए तैयार) -->
    <link rel="manifest" href="data:application/json,{}">

    <style>
        /* ========== ग्लोबल स्टाइल ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #F0F2F8;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            overflow-x: hidden;
        }

        :root {
            --primary: #0D1B3E;
            --primary-light: #152A5A;
            --gold: #FFB800;
            --gold-light: #FFD54F;
            --white: #FFFFFF;
            --light-bg: #F0F2F8;
            --red: #E53935;
            --green: #2E7D32;
            --blue-accent: #2979FF;
            --text-dark: #1A1A2E;
            --text-gray: #666666;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 8px 25px rgba(0,0,0,0.12);
            --shadow-lg: 0 15px 40px rgba(0,0,0,0.18);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ========== स्प्लैश स्क्रीन ========== */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0D1B3E 0%, #0A1528 50%, #152A5A 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splashScreen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo-container {
            position: relative;
            margin-bottom: 20px;
        }

        .splash-logo {
            font-size: 80px;
            animation: floatLogo 2.5s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-18px) scale(1.05); }
        }

        .splash-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border: 3px solid rgba(255,184,0,0.3);
            border-radius: 50%;
            animation: pulseRing 2s ease-out infinite;
        }

        @keyframes pulseRing {
            0% { width: 100px; height: 100px; opacity: 1; }
            100% { width: 180px; height: 180px; opacity: 0; }
        }

        .splash-app-name {
            font-size: 44px;
            font-weight: 900;
            color: var(--white);
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(255,184,0,0.4);
        }

        .splash-tagline {
            font-size: 17px;
            color: var(--gold);
            margin-top: 12px;
            letter-spacing: 3px;
            font-weight: 500;
        }

        .splash-loader-container {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .splash-loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top: 4px solid var(--gold);
            border-right: 4px solid var(--gold);
            border-radius: 50%;
            animation: spinLoader 1s linear infinite;
        }

        @keyframes spinLoader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .splash-loading-text {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* ========== लॉगिन स्क्रीन ========== */
        #loginScreen {
            display: none;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--light-bg);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            background: linear-gradient(160deg, #0D1B3E 0%, #152A5A 40%, #1E3A6E 100%);
            padding: 55px 24px 45px;
            text-align: center;
            border-radius: 0 0 50px 50px;
            position: relative;
            overflow: hidden;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: rgba(255,184,0,0.08);
            border-radius: 50%;
        }

        .login-header::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: -30px;
            width: 100px;
            height: 100px;
            background: rgba(255,184,0,0.06);
            border-radius: 50%;
        }

        .login-header h1 {
            color: var(--white);
            font-size: 30px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .login-header p {
            color: #B0C4DE;
            font-size: 16px;
            position: relative;
            z-index: 1;
        }

        .login-container {
            padding: 30px 20px;
            max-width: 440px;
            margin: -20px auto 0;
            position: relative;
            z-index: 2;
        }

        .login-btn {
            display: block;
            width: 100%;
            padding: 17px;
            font-size: 16px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            border: 2px solid var(--gold);
            background-color: var(--white);
            color: var(--primary);
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .login-btn:active {
            transform: scale(0.97);
            box-shadow: var(--shadow-md);
        }

        .login-btn.gold-btn {
            background: linear-gradient(135deg, #FFB800, #FFA000);
            color: var(--primary);
            border: none;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .login-btn.gold-btn:active {
            background: linear-gradient(135deg, #FFC107, #FF8F00);
        }

        .register-link {
            text-align: center;
            margin-top: 18px;
            color: #555;
            font-size: 15px;
        }

        .register-link a {
            color: var(--gold);
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: var(--transition);
        }

        .register-link a:active {
            background-color: #FFF8E1;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 16px;
            border: 2px solid #E0E0E0;
            border-radius: var(--radius-sm);
            font-size: 15px;
            transition: var(--transition);
            background-color: var(--white);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(255,184,0,0.1);
        }

        .back-link {
            text-align: center;
            margin-top: 16px;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            padding: 8px;
            transition: var(--transition);
        }

        .back-link:active {
            color: var(--gold);
        }

        /* ========== डैशबोर्ड ========== */
        #dashboard {
            display: none;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--light-bg);
            padding-bottom: 40px;
            animation: fadeInUp 0.5s ease;
        }

        .top-header {
            background: linear-gradient(90deg, #0D1B3E, #152A5A);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .top-header .brand {
            color: var(--white);
            font-weight: 700;
            font-size: 18px;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .top-header .search-bar {
            flex: 1;
            margin: 0 8px;
            padding: 10px 16px;
            border-radius: 25px;
            border: 1.5px solid rgba(255,255,255,0.2);
            font-size: 13px;
            background-color: rgba(255,255,255,0.1);
            color: var(--white);
            max-width: 220px;
            transition: var(--transition);
        }

        .top-header .search-bar:focus {
            outline: none;
            background-color: rgba(255,255,255,0.2);
            border-color: var(--gold);
        }

        .top-header .search-bar::placeholder {
            color: #AABBCC;
        }

        .top-header .header-icons {
            display: flex;
            gap: 18px;
            color: var(--white);
            font-size: 21px;
            cursor: pointer;
        }

        .top-header .header-icons span {
            transition: var(--transition);
            padding: 4px;
            border-radius: 50%;
        }

        .top-header .header-icons span:active {
            background-color: rgba(255,184,0,0.2);
            transform: scale(0.9);
        }

        .welcome-section {
            padding: 22px 18px 12px;
        }

        .welcome-section h2 {
            color: var(--primary);
            font-size: 26px;
            font-weight: 800;
        }

        .welcome-section p {
            color: var(--text-gray);
            font-size: 15px;
            margin-top: 6px;
        }

        /* आइकॉन ग्रिड */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            padding: 8px 16px;
        }

        .icon-grid-small {
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .icon-card {
            background: linear-gradient(145deg, #0D1B3E, #152A5A);
            border: 2px solid var(--gold);
            border-radius: var(--radius-md);
            padding: 22px 8px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .icon-card::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 60px;
            height: 60px;
            background: rgba(255,184,0,0.1);
            border-radius: 50%;
            transition: var(--transition);
        }

        .icon-card:active {
            transform: translateY(-5px) scale(0.96);
            box-shadow: 0 15px 35px rgba(255,184,0,0.4);
        }

        .icon-card .icon {
            font-size: 40px;
            position: relative;
            z-index: 1;
        }

        .icon-card .label {
            color: var(--white);
            font-weight: 600;
            font-size: 13px;
            margin-top: 10px;
            position: relative;
            z-index: 1;
            letter-spacing: 0.3px;
        }

        .icon-card-small {
            background-color: var(--white);
            border: 1.5px solid #D8E0EE;
            border-radius: var(--radius-sm);
            padding: 16px 6px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .icon-card-small:active {
            transform: translateY(-4px) scale(0.95);
            box-shadow: var(--shadow-md);
            border-color: var(--gold);
        }

        .icon-card-small .icon {
            font-size: 30px;
        }

        .icon-card-small .label {
            color: var(--primary);
            font-weight: 600;
            font-size: 11px;
            margin-top: 7px;
        }

        /* कोट और फुटर */
        .quote-section {
            text-align: center;
            padding: 22px 18px;
            color: #888;
            font-style: italic;
            font-size: 14px;
            animation: fadeInUp 1s ease;
        }

        .footer-bar {
            background: linear-gradient(90deg, #0D1B3E, #152A5A);
            color: rgba(255,255,255,0.8);
            text-align: center;
            padding: 15px;
            font-size: 12px;
            margin-top: 25px;
            letter-spacing: 0.5px;
        }

        /* ========== मोडल ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.65);
            z-index: 200;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background-color: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 92%;
            max-width: 480px;
            max-height: 82vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.35s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal h3 {
            color: var(--primary);
            margin-bottom: 16px;
            font-size: 21px;
            font-weight: 700;
        }

        .modal-close {
            float: right;
            font-size: 26px;
            cursor: pointer;
            color: #999;
            padding: 4px 8px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .modal-close:active {
            background-color: #f0f0f0;
            color: var(--red);
        }

        /* ========== कोर्स कार्ड ========== */
        .course-card {
            background: white;
            border-radius: var(--radius-sm);
            padding: 16px;
            margin: 12px 0;
            box-shadow: var(--shadow-sm);
            border-left: 5px solid var(--gold);
            transition: var(--transition);
        }

        .course-card:active {
            box-shadow: var(--shadow-md);
            transform: scale(0.98);
        }

        .course-card h4 {
            color: var(--primary);
            margin-bottom: 6px;
            font-size: 16px;
        }

        .course-card p {
            color: var(--text-gray);
            font-size: 13px;
            margin: 4px 0;
        }

        .badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin: 4px 0;
        }

        .badge-free {
            background-color: #E8F5E9;
            color: var(--green);
        }

        .badge-premium {
            background: linear-gradient(135deg, #FFF8E1, #FFECB3);
            color: #E65100;
        }

        .btn-small {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
            margin-top: 8px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #FFB800, #FFA000);
            color: var(--primary);
        }

        .btn-gold:active {
            transform: scale(0.95);
        }

        .btn-outline {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        /* ========== लाइव बैज ========== */
        .live-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--red);
            border-radius: 50%;
            animation: blinkLive 1.2s infinite;
            margin-right: 6px;
        }

        @keyframes blinkLive {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--red); }
            50% { opacity: 0.3; box-shadow: 0 0 2px var(--red); }
        }

        /* ========== रिस्पॉन्सिव ========== */
        @media (min-width: 768px) {
            .icon-grid {
                grid-template-columns: repeat(3, 1fr);
                max-width: 600px;
                margin: 0 auto;
            }
            .icon-grid-small {
                grid-template-columns: repeat(4, 1fr);
                max-width: 600px;
                margin: 0 auto;
            }
            .login-container {
                max-width: 450px;
            }
        }

        @media (max-width: 360px) {
            .icon-card .label { font-size: 11px; }
            .icon-card-small .label { font-size: 9px; }
            .splash-app-name { font-size: 32px; }
        }
    </style>
</head>
<body>

    <!-- ==================== स्प्लैश स्क्रीन ==================== -->
    <div id="splashScreen">
        <div class="splash-logo-container">
            <div class="splash-ring"></div>
            <div class="splash-logo">🌉📚</div>
        </div>
        <div class="splash-app-name">शिक्षा सेतु</div>
        <div class="splash-tagline">शिक्षा का पुल, हर घर तक</div>
        <div class="splash-loader-container">
            <div class="splash-loader"></div>
            <div class="splash-loading-text">लोड हो रहा है...</div>
        </div>
    </div>

    <!-- ==================== लॉगिन स्क्रीन ==================== -->
    <div id="loginScreen">
        <div class="login-header">
            <h1>शिक्षा सेतु में आपका स्वागत है! 🙏</h1>
            <p>सीखने का सफ़र शुरू करने के लिए लॉगिन करें</p>
        </div>

        <div class="login-container">
            <!-- मुख्य लॉगिन बटन -->
            <div id="loginButtons">
                <button class="login-btn" onclick="showPhoneLogin()">📱 फ़ोन नंबर से लॉगिन करें</button>
                <button class="login-btn" onclick="showEmailLogin()">📧 ईमेल / ID से लॉगिन करें</button>
                <div class="register-link">
                    नए हैं यहाँ? 👉 <a onclick="showRegister()">रजिस्टर करें</a>
                </div>
            </div>

            <!-- फ़
